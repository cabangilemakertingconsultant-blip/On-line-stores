<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Online Store</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:system-ui,-apple-system,Segoe UI,sans-serif;
    background:#f5f7fb;
    color:#172b4d;
}

.header{
    background:#172b4d;
    color:white;
    padding:14px 18px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:18px;
}

.hero{
    background:white;
    border-radius:16px;
    overflow:hidden;
    text-align:center;
    box-shadow:0 4px 20px #0001;
    margin-bottom:20px;
}

.hero-top{
    height:12px;
}

.hero-content{
    padding:35px 20px;
}

.logo{
    width:110px;
    height:110px;
    object-fit:contain;
    border-radius:16px;
    border:1px solid #ddd;
    background:white;
    margin:auto;
    display:block;
}

h1{
    margin:18px 0 8px;
    font-size:32px;
}

.description{
    color:#667085;
    max-width:650px;
    margin:auto;
    line-height:1.6;
}

.whatsapp{
    display:inline-block;
    margin-top:18px;
    padding:12px 20px;
    background:#18a866;
    color:white;
    text-decoration:none;
    border-radius:10px;
    font-weight:700;
}

.products-title{
    margin:25px 0 12px;
}

.products{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
}

.product{
    background:white;
    border:1px solid #e2e8f0;
    border-radius:14px;
    padding:12px;
    box-shadow:0 3px 12px #0001;
}

.product img{
    width:100%;
    aspect-ratio:1;
    object-fit:cover;
    border-radius:10px;
    display:block;
}

.product h3{
    margin:12px 0 6px;
}

.category{
    color:#667085;
    font-size:14px;
}

.price{
    font-size:20px;
    font-weight:800;
    margin-top:8px;
}

.order{
    display:block;
    text-align:center;
    margin-top:12px;
    padding:10px;
    background:#172b4d;
    color:white;
    text-decoration:none;
    border-radius:9px;
    font-weight:700;
}

.message{
    background:white;
    padding:30px;
    text-align:center;
    border-radius:14px;
    margin-top:20px;
}

.loading{
    color:#667085;
}

.error{
    color:#b42318;
}

.footer{
    text-align:center;
    color:#667085;
    padding:30px 10px;
    font-size:14px;
}

@media(max-width:800px){
    .products{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:520px){
    .products{
        grid-template-columns:1fr;
    }

    h1{
        font-size:27px;
    }
}
</style>
</head>

<body>

<header class="header">
    🏪 <b id="headerName">Online Store</b>
</header>

<main class="container">

    <section id="storeArea">
        <div class="message loading">
            Loading store...
        </div>
    </section>

</main>

<footer class="footer">
    Powered by Cabangile Online Store Builder
</footer>

<script>

const SUPABASE_URL =
"https://tvicrxzjurxhtckhmfle.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_ikI5P2UyVv0Pn2gc6a37aQ_cx6HOI39";

const BUCKET = "Images-video";

const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

function escapeHTML(value){
    return String(value ?? "").replace(
        /[&<>"']/g,
        function(c){
            return {
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"
            }[c];
        }
    );
}

function getSlug(){
    const params = new URLSearchParams(
        window.location.search
    );

    return params.get("slug");
}

function publicImage(path){

    if(!path) return "";

    return db
        .storage
        .from(BUCKET)
        .getPublicUrl(path)
        .data
        .publicUrl;
}

function whatsappNumber(number){

    return String(number || "")
        .replace(/\D/g,"");
}

function createWhatsAppLink(number, product){

    const phone = whatsappNumber(number);

    if(!phone) return "#";

    const message =
        "Hello, I am interested in " +
        product.name +
        " priced at R" +
        Number(product.price || 0).toFixed(2);

    return "https://wa.me/" +
        phone +
        "?text=" +
        encodeURIComponent(message);
}

async function loadStore(){

    const slug = getSlug();

    if(!slug){

        document.getElementById("storeArea").innerHTML =
        `
        <div class="message error">
            <h2>Store link is incomplete</h2>
            <p>Please use the complete store URL.</p>
        </div>
        `;

        return;
    }

    try{

        const {data,error} =
            await db.rpc(
                "get_public_store",
                {
                    p_slug: slug
                }
            );

        if(error) throw error;

        if(!data || data.success !== true){

            document.getElementById("storeArea").innerHTML =
            `
            <div class="message error">
                <h2>Store unavailable</h2>
                <p>
                    This store may be suspended,
                    expired, or does not exist.
                </p>
            </div>
            `;

            return;
        }

        renderStore(
            data.store,
            data.products || []
        );

    }catch(error){

        console.error(error);

        document.getElementById("storeArea").innerHTML =
        `
        <div class="message error">
            <h2>Unable to load store</h2>
            <p>${escapeHTML(error.message)}</p>
        </div>
        `;
    }
}

function renderStore(store,products){

    document.title =
        store.business_name +
        " | Online Store";

    document.getElementById("headerName")
        .textContent =
        store.business_name;

    const color =
        store.primary_color || "#0052cc";

    const logo =
        publicImage(store.logo_path);

    let html = `
    <section class="hero">

        <div
            class="hero-top"
            style="background:${escapeHTML(color)}">
        </div>

        <div class="hero-content">

            ${
                logo
                ?
                `<img
                    class="logo"
                    src="${escapeHTML(logo)}"
                    alt="Store logo">`
                :
                ""
            }

            <h1>
                ${escapeHTML(store.business_name)}
            </h1>

            <p class="description">
                ${escapeHTML(
                    store.description ||
                    "Welcome to our store."
                )}
            </p>
    `;

    if(store.whatsapp){

        const phone =
            whatsappNumber(store.whatsapp);

        html += `
            <a
                class="whatsapp"
                href="https://wa.me/${phone}"
                target="_blank"
                rel="noopener">
                💬 Contact us on WhatsApp
            </a>
        `;
    }

    html += `
        </div>
    </section>

    <h2 class="products-title">
        Our Products
    </h2>

    <section class="products">
    `;

    if(!products.length){

        html += `
            <div class="message">
                <p>No products available yet.</p>
            </div>
        `;

    }else{

        products.forEach(product => {

            const images =
                product.images || [];

            const firstImage =
                images.length
                ? publicImage(
                    images[0].storage_path
                  )
                : "";

            html += `
            <article class="product">

                ${
                    firstImage
                    ?
                    `<img
                        src="${escapeHTML(firstImage)}"
                        alt="${escapeHTML(product.name)}">`
                    :
                    ""
                }

                <h3>
                    ${escapeHTML(product.name)}
                </h3>

                ${
                    product.category
                    ?
                    `<div class="category">
                        ${escapeHTML(product.category)}
                    </div>`
                    :
                    ""
                }

                ${
                    product.description
                    ?
                    `<p>
                        ${escapeHTML(product.description)}
                    </p>`
                    :
                    ""
                }

                <div class="price">
                    R${Number(
                        product.price || 0
                    ).toFixed(2)}
                </div>

                ${
                    store.whatsapp
                    ?
                    `<a
                        class="order"
                        href="${escapeHTML(
                            createWhatsAppLink(
                                store.whatsapp,
                                product
                            )
                        )}"
                        target="_blank"
                        rel="noopener">
                        Order on WhatsApp
                    </a>`
                    :
                    ""
                }

            </article>
            `;
        });
    }

    html += `
    </section>
    `;

    document.getElementById("storeArea")
        .innerHTML = html;
}

loadStore();

</script>

</body>
</html>
