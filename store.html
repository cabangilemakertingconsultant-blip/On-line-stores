<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cabangile Online Store</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fb;color:#172b4d}header{background:#172b4d;color:#fff;padding:16px 20px}main{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e1e6ef;border-radius:14px;padding:20px;box-shadow:0 4px 18px #0001;margin-bottom:18px}.hero{text-align:center;border-top:12px solid}.logo{width:110px;height:110px;object-fit:contain;border-radius:14px;border:1px solid #ddd}.center{display:block;margin:0 auto 14px}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.product{border:1px solid #e2e8f0;border-radius:12px;padding:12px}.product img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}.price{font-size:20px;font-weight:800}.btn{display:inline-block;padding:11px 14px;border-radius:9px;text-decoration:none;font-weight:700}.wa{background:#18a866;color:#fff}.muted{color:#667085}.trial{display:inline-block;background:#d1fae5;color:#065f46;padding:6px 10px;border-radius:20px;font-weight:700;font-size:13px}.error{background:#fff0f0;color:#b42318}@media(max-width:800px){.products{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.products{grid-template-columns:1fr}}
</style></head><body><header><b>🏪 Cabangile Online Store</b></header><main><div id="loading" class="card">Loading store...</div><div id="error" class="card error" style="display:none"></div><div id="store" style="display:none"><section id="hero" class="card hero"></section><section class="card"><h2>Products</h2><div id="products" class="products"></div></section></div></main>
<script>
const U="https://tvicrxzjurxhtckhmfle.supabase.co",K="sb_publishable_ikI5P2UyVv0Pn2gc6a37aQ_cx6HOI39",B="Images-video",db=supabase.createClient(U,K);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));const wa=n=>String(n||"").replace(/\D/g,"");const wurl=(n,t)=>`https://wa.me/${wa(n)}?text=${encodeURIComponent(t)}`;
async function load(){
 let slug=new URLSearchParams(location.search).get("slug");if(!slug)throw Error("No store slug was provided.");
 let{data:s,error}=await db.from("stores").select("*").eq("slug",slug).maybeSingle();if(error)throw error;if(!s)throw Error("Store not found.");
 if(s.status!=="trial"&&s.status!=="active")throw Error("This store is not currently active.");
 if(s.status==="trial"&&s.trial_ends_at&&new Date()>new Date(s.trial_ends_at))throw Error("This free trial has ended. The store owner must activate the R200 / 30-day plan.");
 let logo=s.logo_path?db.storage.from(B).getPublicUrl(s.logo_path).data.publicUrl:"",phone=wa(s.whatsapp),color=s.primary_color||"#0052cc";
 $("hero").style.borderColor=color;$("hero").innerHTML=`${logo?`<img class="logo center" src="${esc(logo)}">`:""}<h1>${esc(s.business_name||"Online Store")}</h1><p class="muted">${esc(s.description||"Welcome to our store.")}</p>${s.status==="trial"?'<p><span class="trial">FREE 7-DAY TRIAL</span></p>':""}${phone?`<p><a class="btn wa" target="_blank" href="${esc(wurl(phone,"Hello, I would like to contact you about your store."))}">💬 Contact us on WhatsApp</a></p>`:""}`;
 let{data:ps,error:pe}=await db.from("products").select("*").eq("store_id",s.id).eq("active",true).order("created_at",{ascending:false});if(pe)throw pe;
 let html="";
 for(let p of ps||[]){let{data:ims}=await db.from("product_images").select("storage_path").eq("product_id",p.id).order("created_at",{ascending:true});let img=ims?.[0]?db.storage.from(B).getPublicUrl(ims[0].storage_path).data.publicUrl:"";html+=`<article class="product">${img?`<img src="${esc(img)}" alt="${esc(p.name)}">`:""}<h3>${esc(p.name)}</h3>${p.category?`<p class="muted">${esc(p.category)}</p>`:""}<p>${esc(p.description||"")}</p><div class="price">R${Number(p.price||0).toFixed(2)}</div>${phone?`<p><a class="btn wa" target="_blank" href="${esc(wurl(phone,`Hello, I would like to order ${p.name} for R${Number(p.price||0).toFixed(2)}.`))}">🛒 Order on WhatsApp</a></p>`:""}</article>`}
 $("products").innerHTML=html||'<p class="muted">No products available.</p>';$("loading").style.display="none";$("store").style.display="block";
}
load().catch(e=>{$("loading").style.display="none";$("error").textContent="❌ "+e.message;$("error").style.display="block"});
</script></body></html>
