<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cabangile Online Store</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:system-ui,-apple-system,Segoe UI,sans-serif;
 background:#f5f7fb;
 color:#172b4d
}

header{
 background:#172b4d;
 color:#fff;
 padding:16px 20px
}

main{
 max-width:1100px;
 margin:auto;
 padding:18px
}

.card{
 background:#fff;
 border:1px solid #e1e6ef;
 border-radius:14px;
 padding:20px;
 box-shadow:0 4px 18px #0001;
 margin-bottom:18px
}

.hero{
 text-align:center;
 border-top:12px solid
}

.logo{
 width:110px;
 height:110px;
 object-fit:contain;
 border-radius:14px;
 border:1px solid #ddd
}

.center{
 display:block;
 margin:0 auto 14px
}

.products{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:14px
}

.product{
 border:1px solid #e2e8f0;
 border-radius:12px;
 padding:12px;
 background:#fff
}

.product img{
 width:100%;
 aspect-ratio:1;
 object-fit:cover;
 border-radius:8px
}

.price{
 font-size:20px;
 font-weight:800
}

.btn{
 display:inline-block;
 padding:11px 14px;
 border-radius:9px;
 text-decoration:none;
 font-weight:700
}

.wa{
 background:#18a866;
 color:#fff
}

.muted{
 color:#667085
}

.trial{
 display:inline-block;
 background:#d1fae5;
 color:#065f46;
 padding:6px 10px;
 border-radius:20px;
 font-weight:700;
 font-size:13px
}

.active{
 display:inline-block;
 background:#dbeafe;
 color:#1e40af;
 padding:6px 10px;
 border-radius:20px;
 font-weight:700;
 font-size:13px
}

.error{
 background:#fff0f0;
 color:#b42318
}

.loading{
 text-align:center;
 padding:40px
}

@media(max-width:800px){
 .products{
  grid-template-columns:repeat(2,1fr)
 }
}

@media(max-width:520px){
 .products{
  grid-template-columns:1fr
 }
}
</style>
</head>

<body>

<header>
 <b>🏪 Cabangile Online Store</b>
</header>

<main>

<div id="loading" class="card loading">
 Loading store...
</div>

<div id="error" class="card error" style="display:none"></div>

<div id="store" style="display:none">

 <section id="hero" class="card hero"></section>

 <section class="card">
  <h2>Products</h2>
  <div id="products" class="products"></div>
 </section>

</div>

</main>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://tvicrxzjurxhtckhmfle.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_ikI5P2UyVv0Pn2gc6a37aQ_cx6HOI39";

const BUCKET = "Images-video";

const db = supabase.createClient(
 SUPABASE_URL,
 SUPABASE_ANON_KEY
);


/* =========================================================
   IMPORTANT DOM HELPER
========================================================= */

function $(id){
 return document.getElementById(id);
}


/* =========================================================
   SECURITY / HELPERS
========================================================= */

function escapeHTML(value){
 return String(value ?? "").replace(
  /[&<>"']/g,
  function(c){
   return {
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
   }[c];
  }
 );
}


function cleanWhatsApp(number){
 return String(number || "").replace(/\D/g,"");
}


function whatsappURL(number,message){

 const phone = cleanWhatsApp(number);

 if(!phone){
  return "";
 }

 return "https://wa.me/" +
  phone +
  "?text=" +
  encodeURIComponent(message);
}


/* =========================================================
   SUPABASE PUBLIC IMAGE URL
========================================================= */

function publicImage(path){

 if(!path){
  return "";
 }

 const result =
  db.storage
   .from(BUCKET)
   .getPublicUrl(path);

 return result?.data?.publicUrl || "";
}


/* =========================================================
   LOAD STORE
========================================================= */

async function loadStore(){

 try{

  /* Get slug from URL */

  const params =
   new URLSearchParams(window.location.search);

  const slug =
   params.get("slug");


  if(!slug){

   throw new Error(
    "No store slug was provided."
   );

  }


  /* Find store */

  const {
   data:store,
   error:storeError
  } =
   await db
    .from("stores")
    .select("*")
    .eq("slug",slug)
    .maybeSingle();


  if(storeError){
   throw storeError;
  }


  if(!store){

   throw new Error(
    "Store not found. Please check the store URL."
   );

  }


  /* =====================================================
     STORE STATUS
  ===================================================== */

  const status =
   String(store.status || "").toLowerCase();


  if(
   status !== "trial" &&
   status !== "active"
  ){

   throw new Error(
    "This store is currently unavailable."
   );

  }


  /* =====================================================
     FREE TRIAL CHECK
  ===================================================== */

  if(
   status === "trial" &&
   store.trial_ends_at
  ){

   const trialEnd =
    new Date(store.trial_ends_at);

   const now =
    new Date();

   if(now > trialEnd){

    throw new Error(
     "This free trial has ended. The store owner must activate the R200 / 30-day plan."
    );

   }

  }


  /* =====================================================
     STORE DETAILS
  ===================================================== */

  const businessName =
   store.business_name ||
   "Cabangile Online Store";

  const description =
   store.description ||
   "Welcome to our online store.";

  const color =
   store.primary_color ||
   "#0052cc";

  const phone =
   cleanWhatsApp(store.whatsapp);

  const logo =
   publicImage(store.logo_path);


  /* =====================================================
     HERO
  ===================================================== */

  $("hero").style.borderColor =
   color;


  let heroHTML = "";


  if(logo){

   heroHTML += `
    <img
     class="logo center"
     src="${escapeHTML(logo)}"
     alt="Store logo"
     onerror="this.style.display='none'"
    >
   `;

  }


  heroHTML += `
   <h1>${escapeHTML(businessName)}</h1>

   <p class="muted">
    ${escapeHTML(description)}
   </p>
  `;


  if(status === "trial"){

   heroHTML += `
    <p>
     <span class="trial">
      FREE 7-DAY TRIAL
     </span>
    </p>
   `;

  }else{

   heroHTML += `
    <p>
     <span class="active">
      STORE ACTIVE
     </span>
    </p>
   `;

  }


  /* =====================================================
     WHATSAPP MAIN BUTTON
  ===================================================== */

  if(phone){

   const contactURL =
    whatsappURL(
     phone,
     "Hello, I would like to contact you about your store."
    );


   heroHTML += `
    <p>
     <a
      class="btn wa"
      href="${escapeHTML(contactURL)}"
      target="_blank"
      rel="noopener"
     >
      💬 Contact us on WhatsApp
     </a>
    </p>
   `;

  }


  $("hero").innerHTML =
   heroHTML;


  /* =====================================================
     LOAD PRODUCTS
  ===================================================== */

  const {
   data:productRows,
   error:productsError
  } =
   await db
    .from("products")
    .select("*")
    .eq("store_id",store.id)
    .eq("active",true)
    .order("created_at",{ascending:false});


  if(productsError){
   throw productsError;
  }


  let productsHTML = "";


  for(
   const product of productRows || []
  ){

   /* Get product images */

   const {
    data:imageRows
   } =
    await db
     .from("product_images")
     .select("storage_path")
     .eq("product_id",product.id)
     .order("created_at",{ascending:true});


   let image = "";


   if(
    imageRows &&
    imageRows.length > 0
   ){

    image =
     publicImage(
      imageRows[0].storage_path
     );

   }


   productsHTML += `
    <article class="product">

     ${
      image
       ?
       `
       <img
        src="${escapeHTML(image)}"
        alt="${escapeHTML(product.name)}"
        loading="lazy"
        onerror="this.style.display='none'"
       >
       `
       :
       ""
     }

     <h3>
      ${escapeHTML(product.name)}
     </h3>

     ${
      product.category
       ?
       `
       <p class="muted">
        ${escapeHTML(product.category)}
       </p>
       `
       :
       ""
     }

     <p>
      ${escapeHTML(product.description || "")}
     </p>

     <div class="price">
      R${Number(product.price || 0).toFixed(2)}
     </div>

     ${
      phone
       ?
       `
       <p>
        <a
         class="btn wa"
         href="${escapeHTML(
          whatsappURL(
           phone,
           "Hello, I would like to order " +
           product.name +
           " for R" +
           Number(product.price || 0).toFixed(2) +
           "."
          )
         )}"
         target="_blank"
         rel="noopener"
        >
         🛒 Order on WhatsApp
        </a>
       </p>
       `
       :
       ""
     }

    </article>
   `;

  }


  /* =====================================================
     NO PRODUCTS
  ===================================================== */

  if(!productsHTML){

   productsHTML = `
    <p class="muted">
     No products available.
    </p>
   `;

  }


  $("products").innerHTML =
   productsHTML;


  /* =====================================================
     SHOW STORE
  ===================================================== */

  $("loading").style.display =
   "none";

  $("error").style.display =
   "none";

  $("store").style.display =
   "block";


 }catch(error){

  console.error(
   "STORE ERROR:",
   error
  );


  $("loading").style.display =
   "none";

  $("store").style.display =
   "none";

  $("error").textContent =
   "❌ " +
   (
    error?.message ||
    "Unable to load this store."
   );

  $("error").style.display =
   "block";

 }

}


/* =========================================================
   START
========================================================= */

loadStore();

</script>

</body>
</html>
